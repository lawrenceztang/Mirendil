services:
  migrate:
    build: .
    command: node dist/migrate.js
    environment: &env
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      WORKSPACE_ROOT: ${PWD}/.relay/workspaces
      AGENT_IMAGE: relay-agent:latest
      CODEX_MODEL: ${CODEX_MODEL:-}
      MASTER_KEY: ${MASTER_KEY:-replace-me-with-at-least-32-random-characters}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  web:
    build: .
    ports: ["3000:3000"]
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: .
    command: node dist/worker.js
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    # Docker socket ownership varies across Docker Desktop/Colima hosts. The
    # orchestrator needs socket access; spawned agent containers remain UID 10001.
    user: root
    environment: *env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/.relay/workspaces:${PWD}/.relay/workspaces
    depends_on: { migrate: { condition: service_completed_successfully } }
